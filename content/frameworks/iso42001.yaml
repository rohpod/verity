# ISO/IEC 42001:2023 Annex A. IDs and our own one-line summaries ONLY: no ISO text, and nobody
# here has read the standard. Each summary is drawn from the control's public title, so these
# are `public_listing` (ADR 0017). The IDs match on two public listings; see content/README.md
# for a third listing that disagrees. iso.org refuses automated reads, so it was not checked.
framework:
