# 25 further AI systems at Kestrel Cloud Ltd, so the dashboard has realistic volume (architecture
# section C). All FICTIONAL and `synthetic`: they have no AWS resources, and the four suppliers
# below are invented companies. Gaps are on purpose, for the assessment engine to find:
#   legacy-faq-bot        has no owner
#   meeting-minutes-draft records no model, so its provider is unknown (D13)
# Five systems run on the simulated Bedrock and four on the simulated OpenAI (with the demo ones).
source: synthetic

providers:
  - {slug: corvid-labs, name: Corvid Labs Ltd}
  - {slug: halden-analytics, name: Halden Analytics GmbH}
  - {slug: lumenfield-ai, name: Lumenfield AI Ltd}
  - {slug: pinewood-speech, name: Pinewood Speech Ltd}

models:
  - {slug: corvid-chat, name: Corvid Chat, origin: third_party, provider: corvid-labs}
  - {slug: corvid-embed, name: Corvid Embed, origin: third_party, provider: corvid-labs}
  - {slug: halden-forecast, name: Halden Forecast, origin: third_party, provider: halden-analytics}
  - {slug: lumenfield-vision, name: Lumenfield Vision, origin: third_party, provider: lumenfield-ai}
  - {slug: pinewood-asr, name: Pinewood ASR, origin: third_party, provider: pinewood-speech}
  - {slug: ticket-classifier, name: Ticket classifier, origin: in_house, trained_on: [support-tickets]}
  - {slug: churn-gbm, name: Churn gradient-boosted trees, origin: in_house, trained_on: [billing-history, usage-telemetry]}
  - {slug: fraud-iforest, name: Payment fraud isolation forest, origin: in_house, trained_on: [billing-history]}
  - {slug: lead-scorer, name: Lead scorer, origin: in_house, trained_on: [crm-records]}
  - {slug: recommender-als, name: Feature recommender, origin: in_house, trained_on: [usage-telemetry]}
  - {slug: doc-ranker, name: Document ranker, origin: in_house, trained_on: [product-docs]}
  - {slug: anomaly-ae, name: Log anomaly autoencoder, origin: in_house, trained_on: [security-logs]}
  - {slug: cv-parser, name: CV field extractor, origin: in_house, trained_on: [applicants]}

datasets:
  - {slug: product-docs, name: Product documentation, classification: public, personal_data: false}
  - {slug: usage-telemetry, name: Product usage telemetry, classification: internal, personal_data: false}
  - {slug: sales-pipeline, name: Sales pipeline, classification: internal, personal_data: false}
  - {slug: crm-records, name: CRM records, classification: confidential, personal_data: true}
  - {slug: support-tickets, name: Support tickets, classification: confidential, personal_data: true}
  - {slug: invoice-images, name: Invoice images, classification: confidential, personal_data: true}
  - {slug: billing-history, name: Billing history, classification: restricted, personal_data: true}
  - {slug: call-recordings, name: Support call recordings, classification: restricted, personal_data: true}
  - {slug: id-scans, name: Identity document scans, classification: restricted, personal_data: true}
  - {slug: security-logs, name: Security logs, classification: internal, personal_data: true}

risks:
  - slug: faq-outdated-answers
    title: Retired bot gives outdated answers
    description: The old FAQ bot keeps answering from documentation nobody maintains.
    owner: b-adeyemi
    mitigated_by: [VC-031]
  - slug: customer-data-in-prompts
    title: Customer data in prompts
    description: Staff or tools send customer personal data to an AI supplier that has no agreement to receive it.
    owner: s-brennan
    mitigated_by: [VC-050, VC-063]
  - slug: cv-parsing-errors
    title: CV parsing drops or misreads candidate details
    description: Extraction errors disadvantage candidates before any person looks at them.
    owner: p-ferreira
    mitigated_by: [VC-022, VC-032]
  - slug: id-check-false-rejects
    title: Identity check rejects genuine customers
    description: Genuine customers are refused, unevenly across groups, with no quick route to a person.
    owner: j-oyelaran
    mitigated_by: [VC-014, VC-033]
  - slug: recording-consent
    title: Recorded calls lack a consent basis
    description: Calls are transcribed or reused without a clear basis for the recording.
    owner: s-brennan
    mitigated_by: [VC-063]
  - slug: forecast-overreliance
    title: Forecast taken as fact
    description: A forecast drives hiring or spending decisions without a human check on its assumptions.
    owner: d-kowalski
    mitigated_by: [VC-032]
  - slug: ocr-misclassification
    title: Invoices booked to the wrong account
    description: A misread invoice is booked and paid before anyone notices.
    owner: d-kowalski
    mitigated_by: [VC-022]
  - slug: churn-model-drift
    title: Churn model drifts
    description: The model's accuracy falls as products and customers change, and nobody notices.
    owner: k-nilsson
    mitigated_by: [VC-031]

systems:
  # --- on the simulated Bedrock -----------------------------------------------------------
  - slug: internal-knowledge-search
    name: Internal Knowledge Search
    purpose: Answer staff questions from internal documentation
    kind: generative_ai
    owner: c-moreau
    developers: [e-vasquez]
    models: [bedrock-fm]
    datasets: [{dataset: product-docs, purpose: retrieval}]
    roles: [deployer]
    use_domains: [internal_productivity]
    interacts_with_people: true
    generates_synthetic_content: true
    first_placed_on_market: 2026-02-10
  - slug: sales-email-drafter
    name: Sales Email Drafter
    purpose: Draft outreach emails for sales staff to review and send
    kind: generative_ai
    owner: n-petrova
    models: [bedrock-fm]
    datasets: [{dataset: crm-records, purpose: inference}]
    risks: [customer-data-in-prompts]
    roles: [deployer]
    use_domains: [sales]
    interacts_with_people: true
    generates_synthetic_content: true
    first_placed_on_market: 2026-05-04
  - slug: legacy-faq-bot
    name: Legacy FAQ Bot
