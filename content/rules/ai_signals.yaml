# What the crawler treats as a sign that a Lambda function is AI (architecture section D, ADR 0021).
#
# Signals combine into `ai_likelihood`. The strongest wins, in the order declared, confirmed_usage,
# probable, possible, and every signal that fired is stored so the UI can say why. The crawler
# reads env var names only, never values.

evidence_valid_days: 30 # how long crawler evidence stays fresh
evidence_refresh_days: 8 # write it again when this many days or fewer are left
trail_lookback_days: 90 # CloudTrail event history keeps 90 days
trail_event_sources: [bedrock.amazonaws.com]
platform_tag: "verity:component" # the mocks and the crawler itself: never AI candidates
# The tag alone does nothing: a function is exempt only if it also has one of these names, so
# tagging a shadow function cannot hide it (ADR 0022).
platform_functions: [mock-bedrock, mock-openai, verity-crawler]

# The IAM actions that invoke a model, by their real names (ADR 0022). A policy grants one if an
# `Allow` statement's `Action` pattern matches it, or a `NotAction` statement's patterns do not.
# `trail_events` are the CloudTrail event names that prove a call to it: Converse needs the
# `bedrock:InvokeModel` permission, so a `Converse` event proves `bedrock:InvokeModel`. An action
# with no events cannot be shown by event history, so a grant of it is inconclusive.
ai_actions:
  - {action: "bedrock:InvokeModel", trail_events: [InvokeModel, Converse]}
  - {action: "bedrock:InvokeModelWithResponseStream", trail_events: [InvokeModelWithResponseStream, ConverseStream]}
  - {action: "bedrock:InvokeAgent"}
  - {action: "bedrock:InvokeInlineAgent"}
  - {action: "bedrock:InvokeFlow"}
  - {action: "sagemaker:InvokeEndpoint"}
  - {action: "sagemaker:InvokeEndpointAsync"}
  - {action: "sagemaker:InvokeEndpointWithResponseStream"}

signals:
  - {id: tag_system_id, kind: tag, key: "ai:system-id", likelihood: declared}
  - {id: manifest, kind: manifest, likelihood: declared}
  - {id: usage_records, kind: usage_record, likelihood: confirmed_usage}
  - {id: trail_ai_event, kind: trail_event, likelihood: confirmed_usage}
  - {id: iam_ai_action, kind: iam_action, likelihood: probable}
  # Matched against an env var name, ignoring case: a vendor word as a whole `_`-separated part
  # in any position (`AWS_BEDROCK_REGION`), or `MODEL_ID` and `MODEL_ADAPTER` at the end.
  - id: env_ai_name
    kind: env_name
    likelihood: probable
    pattern: '(^|_)(OPENAI|ANTHROPIC|BEDROCK|SAGEMAKER|GEMINI|COHERE|MISTRAL|HUGGINGFACE|HF|LLM|GPT|CHATGPT)(_|$)|(^|_)MODEL_(ID|ADAPTER)$'
  # Matched against each whole token of the name and the description, split on anything that is
  # not a letter or digit and at CamelCase boundaries, so `mail`, `email` and `maintenance` never match `ai`.
  - id: name_ai_token
    kind: name
    likelihood: possible
    pattern: 'ai|ml|llm|gpt\d*|genai|chatbot|copilot|assistant|summariser|summarizer|classifier|embedding|embeddings|inference|openai|bedrock|sagemaker'
