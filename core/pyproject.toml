[project]
name = "verity-core"
version = "0.0.0"
description = "Verity domain model, graph repository, discovery, rules and assessment engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "networkx>=3.3",
    "pydantic>=2.14.3",
    "pyyaml>=6",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.35",
]

[project.scripts]
verity = "verity_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_core"]
