[project]
name = "verity"
version = "0.0.0"
description = "Verity workspace root: AI governance, risk and compliance platform"
requires-python = ">=3.12,<3.13"
dependencies = ["verity-core", "verity-ai"]

[dependency-groups]
dev = [
    "jsonschema>=4.26",  # validates the snapshot against its schema (ADR 0029, decision 12)
    "moto[dynamodb,awslambda,iam,ssm,resourcegroupstaggingapi]>=5.2.5",
    "pytest>=8",
    "python-hcl2>=8.1.4",
    "ruff>=0.17.4",
]
# Training only. The Lambda never imports it (ADR 0023, decision 10).
train = ["scikit-learn"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "sdk"]

[tool.uv.sources]
verity-core = { workspace = true }
verity-ai = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# pytest's defaults without `build`, which would silently skip tests/build (ADR 0026).
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
