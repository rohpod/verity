version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Local workspace member, not a PyPI package. Updating it fails to resolve.
      - dependency-name: verity-core
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
# npm (web/) is added by the milestone that creates that directory.
