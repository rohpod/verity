name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token. This workflow has no secrets and no AWS credentials, by design.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # Node is here for the snapshot type generation only (ADR 0029, decision 12).
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --prefix web
      - run: uv run python scripts/generate_snapshot_contract.py
      - name: The generated contract matches the models
        run: test -z "$(git status --porcelain -- web/generated)"
      # The dashboard (ADR 0031). The fixture is generated here and never committed.
      - run: npm run fixture --prefix web
      - run: uv run python scripts/write_ui_fixtures.py
      - name: The dashboard's test data matches the export
        run: test -z "$(git status --porcelain -- web/src/test)"
      - run: npm run typecheck --prefix web
      - run: npm run lint --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - name: The build carries no snapshot or fixture
        run: npm run check:dist --prefix web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e --prefix web
      - name: The production build, under a /verity/ subpath
        run: npm run e2e:prod --prefix web
      - name: A committed snapshot passes the scan and is the live one
        run: |
          shopt -s nullglob
          for file in web/public/data/*.json; do
            uv run verity export --check "$file" --require-live
          done
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.13.8
          tofu_wrapper: false
      - run: tofu fmt -check -recursive
        working-directory: infra
      - run: tofu init -backend=false -input=false
        working-directory: infra
      - run: tofu validate
        working-directory: infra
